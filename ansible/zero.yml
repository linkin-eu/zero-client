---
- name: "configure zero client"
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    branch_version: 4
    hide_apps:
      - /usr/share/applications/org.gnome.gedit.desktop
      - /usr/share/applications/gnome-control-center.desktop
      - /usr/share/applications/yelp.desktop
      - /usr/share/applications/org.gnome.Terminal.desktop
      - /usr/share/applications/gnome-language-selector.desktop
      - /usr/share/applications/gnome-session-properties.desktop
      - /usr/share/applications/com.gexperts.Tilix.desktop
      - /usr/share/applications/nm-connection-editor.desktop
    chrome_key_fingerprint: "EB4C1BFD4F042F6DDDCCEC917721F63BD38B4796"

  handlers:
    - name: Reload systemd and restart getty@tty1
      ansible.builtin.systemd:
        daemon_reload: yes
        name: getty@tty1
        state: restarted

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Apply netplan configuration
      ansible.builtin.command:
        cmd: netplan apply
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Reboot
      command: reboot
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

  tasks:
    # ------------------------------------------------------------------------------------------------------------------
    # UPDATE AND CLEANUP APT
    # ------------------------------------------------------------------------------------------------------------------
    - name: Add the Universe repository
      ansible.builtin.apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_distribution_release }} universe"
        state: present
        update_cache: yes

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Upgrade all packages to the latest version
      ansible.builtin.apt:
        name: "*"
        state: latest

    - name: Install/upgrade wget
      ansible.builtin.apt:
        name: wget
        state: latest

    - name: Remove useless packages from the cache and purge
      ansible.builtin.apt:
        autoclean: yes

    - name: Remove dependencies that are no longer required
      ansible.builtin.apt:
        autoremove: yes
        purge: yes

    - name: Install python pip
      ansible.builtin.apt:
        name: python3-pip
        state: latest

    # ------------------------------------------------------------------------------------------------------------------
    # CONFIGURE TTY
    # ------------------------------------------------------------------------------------------------------------------
    - name: Disable other TTYs (tty2-tty6)
      ansible.builtin.systemd:
        name: getty@tty{{ item }}
        enabled: no
        masked: yes
        state: stopped
      loop: [2, 3, 4, 5, 6]
      notify: Reload systemd

    # ------------------------------------------------------------------------------------------------------------------
    # NETWORK CONFIG
    # ------------------------------------------------------------------------------------------------------------------
    - name: Create Netplan configuration for DHCP
      ansible.builtin.copy:
        dest: "/etc/netplan/01-dhcp.yaml"
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              primary:
                match:
                  name: en*
                dhcp4: true
                dhcp-identifier: mac
        owner: root
        group: root
        mode: "0644"
        force: yes
      notify: Apply netplan configuration

    - name: Install basic network debugging tools
      ansible.builtin.apt:
        name:
          - iptables
          - dnsutils
          - iputils-ping
          - traceroute
          - net-tools
          - tcpdump
        state: latest

    # AWS WorkSpaces UDP Marking
    - name: Mark AWS WorkSpaces UDP traffic
      ansible.builtin.iptables:
        chain: OUTPUT
        jump: DSCP
        table: mangle
        set_dscp_mark_class: EF
        protocol: udp
        destination_port: "{{ item }}"
      with_items:
        - "4195"
        - "55002:55003"
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    # Parsec UDP Marking
    - name: Mark Parsec UDP traffic
      ansible.builtin.iptables:
        chain: OUTPUT
        jump: DSCP
        table: mangle
        set_dscp_mark_class: EF
        protocol: udp
        destination_port: "8000:8200"
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    # AWS WorkSpaces TCP Marking
    - name: Mark AWS WorkSpaces TCP traffic
      ansible.builtin.iptables:
        chain: OUTPUT
        jump: DSCP
        table: mangle
        set_dscp_mark_class: AF11
        protocol: tcp
        destination_port: "4195"
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    # HTTPS TCP Marking
    - name: Mark HTTPS TCP traffic
      ansible.builtin.iptables:
        chain: OUTPUT
        jump: DSCP
        table: mangle
        set_dscp_mark_class: AF11
        protocol: tcp
        destination_port: "443"
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Update hostname
      ansible.builtin.hostname:
        name: "LINKIN-ZERO-{{ branch_version }}"
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    # ------------------------------------------------------------------------------------------------------------------
    # OPENBOX AND GUI INSTALLATION
    # ------------------------------------------------------------------------------------------------------------------
    - name: Install Gnome
      ansible.builtin.apt:
        name:
          - gdm3
        state: latest

    - name: Install GUI Applications
      ansible.builtin.apt:
        name:
          - gnome-terminal
          - gnome-system-monitor
        state: latest
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    # ------------------------------------------------------------------------------------------------------------------
    # GOOGLE CHROME (the only browser: captive portal sign-in and links from the remote desktop clients)
    # ------------------------------------------------------------------------------------------------------------------
    # The Chrome package installs and maintains its own repository (google-chrome.sources); the verified repository below only
    # bootstraps the first install and is removed afterwards, so the same packages never come from two sources
    - name: Check whether Chrome already manages its repository
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/google-chrome.sources
      register: chrome_sources

    - name: Install gnupg to verify the Google signing key
      ansible.builtin.apt:
        name: gnupg
        state: present
      when: not chrome_sources.stat.exists

    - name: Ensure the APT keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: not chrome_sources.stat.exists

    - name: Download the Google Linux package signing key
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/linux_signing_key.pub
        dest: /etc/apt/keyrings/google-chrome.asc
        mode: "0644"
      when: not chrome_sources.stat.exists

    - name: Verify the Google signing key fingerprint
      ansible.builtin.shell: >
        gpg -n -q --import --import-options import-show /etc/apt/keyrings/google-chrome.asc 2>/dev/null
        | grep -q {{ chrome_key_fingerprint }}
      changed_when: false
      when: not chrome_sources.stat.exists

    - name: Add the Google Chrome APT repository for the first install
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.asc] https://dl.google.com/linux/chrome/deb/ stable main"
        filename: google-chrome
        state: present
        update_cache: yes
      when: not chrome_sources.stat.exists

    - name: Install Google Chrome
      ansible.builtin.apt:
        name: google-chrome-stable
        state: latest

    - name: Remove the bootstrap repository now that Chrome maintains its own
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/google-chrome.list
        state: absent

    # ------------------------------------------------------------------------------------------------------------------
    # NO SNAPS: nothing uses them since Chrome replaced the Firefox snap; snapd only loads the USB stick at every boot
    # ------------------------------------------------------------------------------------------------------------------
    - name: Remove snapd and all snaps
      ansible.builtin.apt:
        name: snapd
        state: absent
        purge: yes

    - name: Keep snapd from being installed again as a dependency
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/no-snapd
        content: |
          Package: snapd
          Pin: release *
          Pin-Priority: -10
        owner: root
        group: root
        mode: "0644"

    - name: Ensure the local applications directory exists
      ansible.builtin.file:
        path: /usr/local/share/applications
        state: directory
        mode: "0755"

    # An override in /usr/local wins over the package's launcher and survives Chrome updates
    - name: Hide Google Chrome from the app grid
      ansible.builtin.shell: >
        sed '/^\[Desktop Entry\]/a NoDisplay=true' /usr/share/applications/{{ item }} > /usr/local/share/applications/{{ item }}
      args:
        creates: "/usr/local/share/applications/{{ item }}"
      loop:
        - google-chrome.desktop
        - com.google.Chrome.desktop

    - name: Ensure the zero user config directory exists
      ansible.builtin.file:
        path: /home/zero/.config
        state: directory
        owner: zero
        group: zero

    - name: Make Google Chrome the default browser for the zero user
      ansible.builtin.copy:
        dest: /home/zero/.config/mimeapps.list
        content: |
          [Default Applications]
          x-scheme-handler/http=google-chrome.desktop
          x-scheme-handler/https=google-chrome.desktop
          text/html=google-chrome.desktop
        owner: zero
        group: zero
        mode: "0644"

    - name: Configure GDM for auto-login
      ansible.builtin.copy:
        dest: "/etc/gdm3/custom.conf"
        content: |
          [daemon]
          AutomaticLoginEnable=True
          AutomaticLogin=zero
        owner: root
        group: root
        mode: "0644"

    - name: Set preferred session for auto-login user
      ansible.builtin.copy:
        dest: "/home/zero/.dmrc"
        content: |
          [Desktop]
          Session=ubuntu-wayland
        owner: zero
        group: zero
        mode: "0644"

    - name: Ensure GDM is enabled and running
      ansible.builtin.systemd:
        name: gdm
        enabled: yes
        state: started

    # ------------------------------------------------------------------------------------------------------------------
    # WORKSPACE CONFIG
    # ------------------------------------------------------------------------------------------------------------------
    - name: Allow unprivileged users to create user namespaces
      ansible.builtin.sysctl:
        name: kernel.unprivileged_userns_clone
        value: "1"
        state: present
        reload: yes
        sysctl_set: yes
        sysctl_file: /etc/sysctl.d/99-unprivileged-userns-clone.conf

    - name: Create required directories for zero user
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: zero
        group: zero
      loop: ["/home/zero/.config/linkin", "/home/zero/.config/autostart", "/home/zero/.local/share/applications"]

    - name: Get workspace configs
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/techno-link/zero-client/v{{ branch_version }}/desktop/{{ item.file }}"
        dest: "{{ item.dest }}"
        force: yes
        owner: zero
        group: zero
        mode: "{{ item.mode | default(omit) }}"
      loop:
        - { file: "wallpaper.jpg", dest: "/home/zero/.config/linkin/wallpaper.jpg" }
        - { file: "gsettings.sh", dest: "/home/zero/.config/linkin/gsettings.sh", mode: "0755" }
      notify: Reboot

    - name: Ensure the script runs at session start
      copy:
        content: |
          [Desktop Entry]
          Type=Application
          Name=UserSettings
          Exec=/home/zero/.config/linkin/gsettings.sh
          X-GNOME-Autostart-enabled=true
        dest: "/home/zero/.config/autostart/user-settings.desktop"
        owner: zero
        group: zero
        mode: "0644"

    # HIDE APPS: only the ones installed on this device, so a missing app never fails the whole run
    - name: Copy .desktop files to ~/.local/share/applications
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/home/zero/.local/share/applications/"
        force: yes
        owner: zero
        group: zero
        mode: "0644"
      loop: "{{ hide_apps }}"
      when: lookup('env', 'ZEROSTATE') != 'CHROOT' and item is file

    - name: Ensure NoDisplay=true is set in .desktop files
      ansible.builtin.lineinfile:
        path: "/home/zero/.local/share/applications/{{ item | basename }}"
        insertafter: '^\[Desktop Entry\]'
        line: "NoDisplay=true"
        create: no
      loop: "{{ hide_apps }}"
      when: lookup('env', 'ZEROSTATE') != 'CHROOT' and item is file

    # ALLOW UNLOCK SCREEN
    - name: Add nopasswdlogin rule to gdm-password
      ansible.builtin.lineinfile:
        path: /etc/pam.d/gdm-password
        line: "auth sufficient pam_succeed_if.so user ingroup nopasswdlogin"
        insertbefore: BOF

    - name: Create nopasswdlogin group
      ansible.builtin.group:
        name: nopasswdlogin
        state: present

    - name: Add user to nopasswdlogin group
      ansible.builtin.user:
        name: "zero"
        groups: nopasswdlogin
        append: yes

    # ------------------------------------------------------------------------------------------------------------------
    # AWS WORKSPACES CLIENT INSTALL
    # ------------------------------------------------------------------------------------------------------------------
    - name: Install requirements for AWS Workspaces
      ansible.builtin.apt:
        name:
          - libwebkit2gtk-4.1-0
        state: latest

    - name: Check if binary keyring exists
      ansible.builtin.stat:
        path: /usr/share/keyrings/amazon-workspaces-clients.gpg
      register: keyring_stat_before

    - name: Download AWS Workspaces GPG key (ASCII armored)
      ansible.builtin.get_url:
        url: https://workspaces-client-linux-public-key.s3-us-west-2.amazonaws.com/ADB332E7.asc
        dest: /tmp/amazon-workspaces-clients.asc
        mode: "0644"
        force: yes
      register: aws_key_download

    - name: Convert GPG key to binary format and install
      ansible.builtin.command:
        # --batch --yes: overwrite the existing keyring without prompting, since there is no terminal under systemd
        cmd: gpg --batch --yes --dearmor -o /usr/share/keyrings/amazon-workspaces-clients.gpg /tmp/amazon-workspaces-clients.asc
      when: aws_key_download.changed or not keyring_stat_before.stat.exists

    - name: Set correct permissions on GPG keyring
      ansible.builtin.file:
        path: /usr/share/keyrings/amazon-workspaces-clients.gpg
        mode: "0644"
        owner: root
        group: root

    - name: Add AWS Workspaces APT repository for Noble
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/amazon-workspaces-clients.gpg] https://d3nt0h4h6pmmc4.cloudfront.net/ubuntu noble main"
        filename: amazon-workspaces-clients
        state: present
        update_cache: yes

    - name: Install AWS Workspaces client from repository
      ansible.builtin.apt:
        name: workspacesclient
        state: latest

    # ------------------------------------------------------------------------------------------------------------------
    # PARSEC CLIENT INSTALL
    # ------------------------------------------------------------------------------------------------------------------
    - name: Install requirements for Parsec
      ansible.builtin.apt:
        name:
          - libqt5x11extras5
          - xdg-utils
        state: latest

    - name: Install Openssl 3 required for parsec
      ansible.builtin.apt:
        name:
          - openssl
        state: latest

    - name: Install curl required for parsec
      ansible.builtin.apt:
        name:
          - curl
        state: latest

    - name: Check if the Parsec package exists and get its details
      ansible.builtin.stat:
        path: "/home/zero/.config/linkin/parsec-linux.deb"
      register: parsec_file

    - name: Calculate Parsec package age in days
      set_fact:
        file_age_days: "{{ ((ansible_date_time.epoch | int) - (parsec_file.stat.mtime | default(ansible_date_time.epoch | int)) ) / 86400 }}"
      when: parsec_file.stat.exists

    - name: Download the Parsec package if it has been updated
      ansible.builtin.get_url:
        url: "https://builds.parsec.app/package/parsec-linux.deb"
        dest: "/home/zero/.config/linkin/parsec-linux.deb"
        force: yes
        mode: "0755"
      when: not parsec_file.stat.exists or (file_age_days | default(0) | int) >= 7

    - name: Install the downloaded Parsec package
      ansible.builtin.apt:
        deb: "/home/zero/.config/linkin/parsec-linux.deb"

    # ------------------------------------------------------------------------------------------------------------------
    # INSTALL PYTHON PSUTIL LIBRARY REQUIRED FOR COMMUNITY.GENERAL.DCONF
    # ------------------------------------------------------------------------------------------------------------------
    - name: Install psutil python package
      ansible.builtin.apt:
        name: python3-psutil
        state: latest

    # ------------------------------------------------------------------------------------------------------------------
    # LOCALE CONFIGURATION
    # ------------------------------------------------------------------------------------------------------------------
    - name: Generate locales (bg_BG and en_US)
      ansible.builtin.locale_gen:
        name: "{{ item }}"
        state: present
      loop:
        - en_US.UTF-8
        - bg_BG.UTF-8

    # ------------------------------------------------------------------------------------------------------------------
    # SET TIMEZONE
    # ------------------------------------------------------------------------------------------------------------------
    - name: Set timezone to Europe/Sofia
      ansible.builtin.shell: |
        ln -sf /usr/share/zoneinfo/Europe/Sofia /etc/localtime
        echo "Europe/Sofia" > /etc/timezone
      changed_when: false
